<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Market Mini App</title>
    <!-- Подключаем скрипт Telegram, чтобы сайт умел общаться с мессенджером -->
    <script src="https://telegram.org"></script>
    
    <!-- 🎨 БЛОК CSS: Тёмная тема с синими кнопками -->
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }
        h2 { font-size: 22px; margin-bottom: 20px; text-align: center; }

        /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: #1c1c1e;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px 12px 4px;
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 6px 4px;
            background: none; border: none; cursor: pointer;
            color: #8e8e93;
            font-size: 11px; font-weight: 500;
            transition: all 0.2s; border-radius: 8px;
        }
        .nav-item .icon { font-size: 22px; margin-bottom: 2px; }
        .nav-item.active {
            color: #2481cc;
        }
        .nav-item:active { transform: scale(0.95); }

        /* КОНТЕНТ РАЗДЕЛОВ */
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ПРОСТОЙ ТЕКСТ (для пустых разделов) */
        .empty-text {
            text-align: center;
            color: #8e8e93;
            font-size: 16px;
            margin-top: 60px;
        }

        /* ШАПКА ПРОФИЛЯ */
        .profile-header {
            display: flex;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 24px;
        }
        .profile-avatar {
            width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
            border: 2px solid #2481cc;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .profile-info {
            display: flex;
            flex-direction: column;
        }
        .profile-name {
            font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 4px;
        }
        .profile-username {
            font-size: 13px; color: #8e8e93;
        }

        /* СТАТИСТИКА ПРОФИЛЯ */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background-color: #1c1c1e;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .stat-label-text {
            font-size: 15px;
            color: #8e8e93;
        }
        .stat-value-text {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        .stat-value-blue {
            color: #2481cc;
        }
    </style>
</head>
<body>
    <!-- РАЗДЕЛ: ПОДПИСИ -->
    <div id="tab-podpisi" class="tab-content active">
        <h2>📝 Подписи</h2>
        <div class="empty-text">Нет активных продавцов</div>
    </div>

    <!-- РАЗДЕЛ: ЧАТЫ -->
    <div id="tab-chats" class="tab-content">
        <h2>💬 Чаты</h2>
        <div class="empty-text">У вас ещё нет чатов</div>
    </div>

    <!-- РАЗДЕЛ: СПОРЫ -->
    <div id="tab-spory" class="tab-content">
        <h2>⚖️ Споры</h2>
        <div class="empty-text">У вас нет споров</div>
    </div>

    <!-- РАЗДЕЛ: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-content">
        <!-- ШАПКА ПРОФИЛЯ: аватарка слева, никнейм и @username справа -->
        <div class="profile-header">
            <img id="userAvatar" class="profile-avatar" src="" alt="User Avatar">
            <div class="profile-info">
                <div id="userFullName" class="profile-name"></div>
                <div id="userUsername" class="profile-username"></div>
            </div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stat-row">
            <span class="stat-label-text">Ваш баланс:</span>
            <span class="stat-value-text stat-value-blue" id="statBalance">0.00 ₽</span>
        </div>
        <div class="stat-row">
            <span class="stat-label-text">Взяли подписей:</span>
            <span class="stat-value-text" id="statPodpisi">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label-text">Реф. процент:</span>
            <span class="stat-value-text stat-value-blue" id="statRefPercent">5%</span>
        </div>
        <div class="stat-row">
            <span class="stat-label-text">Реф. ссылка:</span>
            <span class="stat-value-text" id="statRefLink">t.me/bot?start=ref_...</span>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="podpisi" onclick="switchTab('podpisi')">
            <span class="icon">📝</span><span>Подписи</span>
        </button>
        <button class="nav-item" data-tab="chats" onclick="switchTab('chats')">
            <span class="icon">💬</span><span>Чаты</span>
        </button>
        <button class="nav-item" data-tab="spory" onclick="switchTab('spory')">
            <span class="icon">⚖️</span><span>Споры</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
            <span class="icon">👤</span><span>Профиль</span>
        </button>
    </nav>

    <!-- ⚙️ JAVASCRIPT -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const tgUser = tg.initDataUnsafe.user;

        // ===== ЗАГРУЗКА ДАННЫХ ЧЕРЕЗ API =====
        async function loadUserData() {
            if (!tgUser) return;

            try {
                // Делаем запрос к нашему Python API
                const response = await fetch('http://localhost:5000/api/user/' + tgUser.id);
                const data = await response.json();

                if (data.success) {
                    const apiUser = data.user;
                    const stats = data.stats;

                    // Полное имя
                    const fullNameEl = document.getElementById('userFullName');
                    if (apiUser.full_name) {
                        fullNameEl.textContent = apiUser.full_name;
                    } else if (apiUser.username) {
                        fullNameEl.textContent = '@' + apiUser.username;
                    } else {
                        fullNameEl.textContent = 'Пользователь';
                    }

                    // @username
                    const usernameEl = document.getElementById('userUsername');
                    if (apiUser.username) {
                        usernameEl.textContent = '@' + apiUser.username;
                    } else {
                        usernameEl.textContent = 'username не указан';
                    }

                    // Аватарка (приоритет: из API, fallback: Telegram)
                    const avatarEl = document.getElementById('userAvatar');
                    if (apiUser.photo_url) {
                        avatarEl.src = apiUser.photo_url;
                    } else {
                        avatarEl.src = 'https://t.me/i/user_' + tgUser.id + '.jpg';
                    }

                    // Статистика из БД
                    document.getElementById('statBalance').textContent = stats.balance.toFixed(2) + ' ₽';
                    document.getElementById('statRefPercent').textContent = stats.ref_percent + '%';
                    document.getElementById('statRefLink').textContent = stats.ref_link.replace('https://', '');
                } else {
                    // Если API не ответил, используем данные из Telegram напрямую
                    useFallbackData();
                }
            } catch (error) {
                console.log('Ошибка API, используем fallback:', error);
                useFallbackData();
            }
        }

        // FALLBACK: данные только из Telegram
        function useFallbackData() {
            if (!tgUser) return;
            
            const fullNameEl = document.getElementById('userFullName');
            let fullName = tgUser.first_name || '';
            if (tgUser.last_name) fullName += ' ' + tgUser.last_name;
            fullNameEl.textContent = fullName || 'Пользователь';

            const usernameEl = document.getElementById('userUsername');
            if (tgUser.username) {
                usernameEl.textContent = '@' + tgUser.username;
            } else {
                usernameEl.textContent = 'username не указан';
            }

            const avatarEl = document.getElementById('userAvatar');
            avatarEl.src = 'https://t.me/i/user_' + tgUser.id + '.jpg';

            document.getElementById('statRefLink').textContent = 
                't.me/testkurgan_bot?start=ref_' + tgUser.id;
        }

        // Пока сразу показываем данные из Telegram (мгновенно)
        useFallbackData();
        
        // Затем пытаемся обновить через API (с аватаркой и статистикой)
        loadUserData();

        // ПЕРЕКЛЮЧЕНИЕ РАЗДЕЛОВ
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.querySelector('.nav-item[data-tab="' + tabName + '"]').classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
    </script>
</body>
</html>
