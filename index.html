    <script>
        const tg = window.Telegram.WebApp;
        
        function initWebApp() {
            try {
                tg.ready();
                tg.expand();
                
                // Создаем переменные по умолчанию
                let userId = "0";
                let firstName = "Пользователь";
                let username = "tg_user";
                
                // Проверяем, прислал ли бот данные через надежный параметр startapp
                let startParam = tg.initDataUnsafe?.start_param;
                
                if (startParam && startParam.includes("___")) {
                    // Разбиваем строку параметров обратно на ID, Имя и Юзернейм
                    let parts = startParam.split("___");
                    userId = parts[0];
                    firstName = decodeURIComponent(parts[1]);
                    username = decodeURIComponent(parts[2]);
                } else if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    // Резервный стандартный метод Telegram
                    const user = tg.initDataUnsafe.user;
                    userId = user.id;
                    firstName = user.first_name;
                    username = user.username || "user";
                }
                
                // Выводим готовые данные на экран (Заменяем "Загрузка..." и "Имя")
                document.getElementById('user-greeting-top').innerText = `@${username}`;
                document.getElementById('user-fullname').innerText = firstName;
                document.getElementById('user-username').innerText = `@${username}`;
                document.getElementById('prof-ref-link').innerText = `https://t.me{userId}`;
                
            } catch (err) {
                document.getElementById('user-greeting-top').innerText = "@market_user";
            }
        }
        
        initWebApp();
        let isSeller = true; 
        if (isSeller) {
            document.getElementById('role-title').innerText = "Продавец";
            document.getElementById('seller-status-block').style.display = "flex";
            document.getElementById('seller-actions').style.display = "block";
        }

        function toggleStatus() {
            const isChecked = document.getElementById('status-toggle').checked;
            const statusText = document.getElementById('status-text');
            if (isChecked) { statusText.innerText = "В СЕТИ"; statusText.style.color = "#007aff"; }
            else { statusText.innerText = "ОФФЛАЙН"; statusText.style.color = "#8e8e93"; }
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        
        function openModal() {
            const form = document.getElementById('product-form');
            form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'block' : 'none';
        }
        
        function saveProduct() { alert('Товар отправлен в общую сеть!'); document.getElementById('product-form').style.display = 'none'; }
        
        function copyRefLink() {
            const linkText = document.getElementById('prof-ref-link').innerText;
            navigator.clipboard.writeText(linkText).then(() => { if (tg.showAlert) tg.showAlert("Ссылка скопирована!"); });
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        
        function changeAvatar() { if (tg.showPopup) tg.showPopup({ title: 'Аватар', message: 'Синхронизируется с Telegram.', buttons: [{type: 'close'}] }); }
        
        function switchTab(tabId) {
            const contents = document.getElementsByClassName('tab-content');
            for (let i = 0; i < contents.length; i++) { contents[i].style.display = 'none'; }
            const buttons = document.getElementsByClassName('nav-button');
            for (let i = 0; i < buttons.length; i++) { buttons[i].classList.remove('active'); }
            
            const activeTab = document.getElementById(tabId);
            if (activeTab) { activeTab.style.display = 'block'; }
            const targetButton = document.getElementById('btn-' + tabId.replace('tab-', ''));
            if (targetButton) { targetButton.classList.add('active'); }
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
